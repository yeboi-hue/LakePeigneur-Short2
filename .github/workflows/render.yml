name: Render Lake Peigneur Short

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "Render scale (1 = 1080x1920; 0.5 = quick preview; 1.3333 = 1440x2560)"
        required: true
        default: "1"
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 \
            libcairo2 libcups2 libgbm1

      - name: Generate narration, score, effects and timing
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts numpy
          python scripts/make_audio.py

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render MP4 with software WebGL
        env:
          SCALE: ${{ github.event.inputs.scale }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts LakePeigneurShort out/lake-peigneur.mp4 \
            --codec h264 --crf 18 --gl=swangle --concurrency=3 --timeout=180000 --scale="${SCALE:-1}"

      - name: Verify MP4 metadata
        run: ffprobe -v error -show_entries stream=codec_type,width,height,duration -of default=nw=1 out/lake-peigneur.mp4

      - name: Upload downloadable MP4
        uses: actions/upload-artifact@v4
        with:
          name: lake-peigneur-mp4
          path: out/lake-peigneur.mp4
          retention-days: 30
          
